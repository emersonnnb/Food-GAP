<header>
  <div class="logo">
    <img src="assets/images/logo.png" alt="Logo" class="logo" />
  </div>
  <div class="top-bar">
    <h2>Selecione uma Categoria</h2>
  </div>
</header>

<div class="container">
  <div
    class="card-produto"
    *ngFor="let categoria of categorias"
    (click)="selecionarCategoria(categoria.id)"    
  >
    <div class="imagem">
      <img [src]="categoria.imagem" alt="{{ categoria.nome }}" />
    </div>
    <div class="info">
      <h2>{{ categoria.nome }}</h2>
      <p>
        {{
          categoria.descricao.length > 80
            ? (categoria.descricao | slice : 0 : 80) + "..."
            : categoria.descricao
        }}
      </p>
      <h3>a partir de R$ {{ categoria.preco | number : "1.2-2" }}</h3>
    </div>
  </div>
</div>
